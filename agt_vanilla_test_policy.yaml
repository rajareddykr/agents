# ─────────────────────────────────────────────────────────────────────────────
#  AGT test policy  —  agentic-mcp-ops-vanilla
#
#  Governs the multi-agent app (Coordinator + Financial + Research agents
#  calling FIN MCP / NEWS MCP). Upload from the dashboard: Governance →
#  Policies → New Policy → paste this whole file → Save → Publish (status =
#  Active) → bind to org "demodevelop" or to the three agents.
#
#  RULE ORDER
#    The SDK's rule engine sorts by `priority` DESCENDING, first match wins.
#    DENY rules MUST have a higher priority than ALLOW rules — otherwise a
#    permissive rule fires first and short-circuits the deny.
#
#        DENY  priority 300  ┐
#        ALLOW priority 100  ┘  (deny > allow)
#
#  CONTENT MATCHING — why `operator: matches` instead of `contains`
#    The kernel builds `ctx["params"]` as the raw params DICT
#    (e.g. {"entity": "SBI"}). The CONTAINS operator does `target in ctx_value`
#    — on a dict that checks KEYS, not values, so "sbi" in {"entity":"SBI"} is
#    False. The MATCHES operator runs `regex.search(str(ctx_value))`, so the
#    dict is stringified and a substring is found. Use `(?i)` for case-
#    insensitive. Contains still works on string-typed fields — see
#    `field: action`.
#
#  GOVERNED ACTIONS IN THIS APP  (action = "<node_id>.<name>")
#    Agent actions .......... fin_agent.analyze,  res_agent.analyze
#    FIN MCP tools .......... fin_mcp.get_quote,  fin_mcp.get_fundamentals,
#                             fin_mcp.get_price_trend
#    NEWS MCP tools ......... news_mcp.search_news,  news_mcp.get_sentiment
#    Lifecycle .............. agent_online   (startup registration)
#
#  ENFORCEMENT NOTE
#    Both engines run: (1) the rule engine over `rules[]` and (2) the legacy
#    list model over `defaults.blocked_actions` / `defaults.blocked_patterns`.
#    Either can deny. `defaults.blocked_patterns` case-insensitively substring-
#    matches the JSON-serialised params, so patterns listed there catch the
#    same substrings the `params matches (?i)…` rules do — belt and braces.
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"
name: agt-vanilla-test-policy
description: >-
  Test governance policy for the agentic-mcp-ops-vanilla multi-agent app.
  Denies direct fundamentals pulls and requests referencing SBI, ICICI,
  confidential or restricted content; allows the safe reads and specialist
  agent actions.

rules:
  # ── DENY rules (priority 300 — evaluated FIRST) ─────────────────────────────
  - name: block-fundamentals
    condition:
      field: action
      operator: eq
      value: fin_mcp.get_fundamentals
    action: deny
    priority: 300
    message: "Direct fundamentals pulls are blocked by policy — use quote/trend instead."

  - name: block-sbi
    condition:
      field: params
      operator: matches
      value: "(?i)sbi"
    action: deny
    priority: 300
    message: "Requests mentioning 'SBI' are blocked by policy."

  - name: block-icici
    condition:
      field: params
      operator: matches
      value: "(?i)icici"
    action: deny
    priority: 300
    message: "Requests mentioning 'ICICI' are blocked by policy."

  - name: block-confidential-content
    condition:
      field: params
      operator: matches
      value: "(?i)confidential"
    action: deny
    priority: 300
    message: "Requests referencing 'confidential' content are blocked by policy."

  - name: block-restricted-content
    condition:
      field: params
      operator: matches
      value: "(?i)restricted"
    action: deny
    priority: 300
    message: "Requests referencing 'restricted' content are blocked by policy."

  # ── ALLOW rules (priority 100 — evaluated AFTER denies) ─────────────────────
  - name: allow-safe-reads
    condition:
      field: action
      operator: in
      value: [fin_mcp.get_quote, fin_mcp.get_price_trend,
              news_mcp.search_news, news_mcp.get_sentiment]
    action: allow
    priority: 100
    message: "Quotes, price trends, news search and sentiment are allowed."

  - name: allow-agent-actions
    condition:
      field: action
      operator: in
      value: [fin_agent.analyze, res_agent.analyze]
    action: allow
    priority: 100
    message: "Financial and Research agent analyses are allowed."

# Belt-and-braces list model. The SDK's legacy path substring-matches these
# against the JSON-serialised params (case-insensitive), so anything listed
# here is denied even if the rules engine were to be turned off.
defaults:
  action: allow
  blocked_actions:
    - fin_mcp.get_fundamentals
  blocked_patterns:
    - sbi
    - icici
    - confidential
    - restricted
  require_approval: []
